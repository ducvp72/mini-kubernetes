services:
  mysql:
    image: mysql:8.4
    container_name: mini-k8s-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mini_k8s_local}
      MYSQL_USER: ${MYSQL_USER:-minik8s}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-minik8spass123}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=300
      - --innodb-lock-wait-timeout=10
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  redpanda:
    image: redpandadata/redpanda:v24.2.12
    container_name: mini-k8s-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "${REDPANDA_EXTERNAL_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda-init:
    image: redpandadata/redpanda:v24.2.12
    container_name: mini-k8s-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create order.created -p 6 -r 1 --brokers redpanda:9092 || true
        rpk topic describe order.created --brokers redpanda:9092
    restart: "no"

  kafka-ui:
    image: redpandadata/console:v2.7.2
    container_name: mini-k8s-kafka-ui
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_SCHEMAREGISTRY_ENABLED: "false"
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: "http://redpanda:9644"
      SERVER_LISTENPORT: "8080"
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mock-webhook:
    image: mendhak/http-https-echo:35
    container_name: mini-k8s-mock-webhook
    restart: unless-stopped
    environment:
      HTTP_PORT: "8090"
      LOG_WITHOUT_NEWLINE: "true"
    ports:
      - "${MOCK_WEBHOOK_PORT:-8090}:8090"

  webhook-service:
    build:
      context: .
      dockerfile: services/webhook-service/Dockerfile
    container_name: mini-k8s-webhook-service
    restart: unless-stopped
    depends_on:
      - mock-webhook
    environment:
      APP_ENV: "${APP_ENV:-local}"
      GRPC_PORT: "5002"
      HEALTH_PORT: "8082"
      MAX_CONCURRENT_CALLBACKS: "64"
      CALLBACK_TIMEOUT_MS: "3000"
      CALLBACK_MAX_ATTEMPTS: "3"
    ports:
      - "${WEBHOOK_GRPC_PORT:-5002}:5002"
      - "${WEBHOOK_HEALTH_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "/webhook-service", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: mini-k8s-order-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      webhook-service:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-local}"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__OrderDb: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-mini_k8s_local};User=${MYSQL_USER:-minik8s};Password=${MYSQL_PASSWORD:-minik8spass123};Pooling=true;MinimumPoolSize=5;MaximumPoolSize=100;ConnectionTimeout=10;"
      Kafka__BootstrapServers: "redpanda:9092"
      Kafka__Topic: "order.created"
      Kafka__ConsumerGroupId: "order-service-workers"
      WebhookClient__Address: "http://webhook-service:5002"
      WebhookClient__TimeoutSeconds: "10"
      Outbox__BatchSize: "100"
      Outbox__PollIntervalMs: "200"
      Database__ApplyMigrationsOnStartup: "true"
      Grpc__Port: "5001"
      Health__Port: "8081"
    ports:
      - "${ORDER_GRPC_PORT:-5001}:5001"
      - "${ORDER_HEALTH_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  open-api:
    build:
      context: .
      dockerfile: services/open-api/Dockerfile
    container_name: mini-k8s-open-api
    restart: unless-stopped
    depends_on:
      order-service:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-local}"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      OrderService__Address: "http://order-service:5001"
      OrderService__TimeoutSeconds: "5"
      RateLimiting__PermitLimit: "1000"
      RateLimiting__WindowSeconds: "1"
      RateLimiting__QueueLimit: "0"
    ports:
      - "${OPEN_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
