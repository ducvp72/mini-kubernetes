name: Reusable — Docker Build & Push (Azure ACR + Docker Hub)

on:
  workflow_call:
    inputs:
      service_name:
        description: Logical service name (e.g., open-api, order-service, webhook-service)
        required: true
        type: string
      dockerfile:
        description: Relative path to the service Dockerfile
        required: true
        type: string
      context:
        description: Docker build context directory
        required: false
        default: "."
        type: string
      target_environment:
        description: Target GitHub Environment (staging for develop, production for main)
        required: true
        type: string
      push_image:
        description: Whether to push the built image (false on PRs, true on develop/main)
        required: false
        default: false
        type: boolean
      platforms:
        description: Target container platform(s)
        required: false
        default: "linux/amd64"
        type: string
    secrets:
      AZURE_CLIENT_ID:
        description: Entra ID Application (client) ID for OIDC federated login
        required: false
      AZURE_TENANT_ID:
        description: Entra ID Directory (tenant) ID
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: Azure Subscription ID
        required: false
      ACR_LOGIN_SERVER:
        description: Azure Container Registry login server (e.g., myacr.azurecr.io)
        required: false
      DOCKERHUB_USERNAME:
        description: Docker Hub username (secondary tracking mirror)
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub Personal Access Token (secondary tracking mirror)
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  docker-build-check:
    name: Docker Build Check (${{ inputs.service_name }})
    if: ${{ !inputs.push_image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile exists on branch
        id: check
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "### Skipped ${SERVICE_NAME} Docker Build Check" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${DOCKERFILE}\` is not present on this branch yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build container image (PR verification, no push)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

  docker-build-push:
    name: Docker Build & Push (${{ inputs.service_name }} -> ${{ inputs.target_environment }})
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image metadata, Dockerfile presence, and registry credentials
        id: meta
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET_ENV: ${{ inputs.target_environment }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$TARGET_ENV" = "production" ]; then
            ENV_PREFIX="prod"
          else
            ENV_PREFIX="staging"
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "env_prefix=${ENV_PREFIX}" >> "$GITHUB_OUTPUT"

          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] && [ -n "$ACR_LOGIN_SERVER" ]; then
            echo "has_acr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_acr=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.meta.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      # --- Primary Registry: Azure Container Registry (used by AKS) ---
      - name: Azure OIDC Login
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_acr == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_acr == 'true'
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and push image to Azure Container Registry (primary for AKS)
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_acr == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.service_name }}:${{ steps.meta.outputs.env_prefix }}-${{ steps.meta.outputs.short_sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.service_name }}:${{ steps.meta.outputs.env_prefix }}-latest
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      # --- Secondary Registry: Docker Hub (tracking mirror; reuses Buildx cache) ---
      - name: Log in to Docker Hub
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub (tracking mirror)
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_dockerhub == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mini-k8s-${{ inputs.service_name }}:${{ steps.meta.outputs.env_prefix }}-${{ steps.meta.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mini-k8s-${{ inputs.service_name }}:${{ steps.meta.outputs.env_prefix }}-latest
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      # --- Fallback when neither registry is configured yet ---
      - name: Build image without push (no registry secrets configured yet)
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_acr != 'true' && steps.meta.outputs.has_dockerhub != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Write job summary
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET_ENV: ${{ inputs.target_environment }}
          EXISTS: ${{ steps.meta.outputs.exists }}
          HAS_ACR: ${{ steps.meta.outputs.has_acr }}
          HAS_DOCKERHUB: ${{ steps.meta.outputs.has_dockerhub }}
          ENV_PREFIX: ${{ steps.meta.outputs.env_prefix }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          if [ "$EXISTS" != "true" ]; then
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Skipped ${SERVICE_NAME} Docker Build & Push (${TARGET_ENV})
          \`${DOCKERFILE}\` is not present on this branch yet.
          EOF
            exit 0
          fi

          echo "### Image Push Summary — ${SERVICE_NAME} (${TARGET_ENV})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_ACR" = "true" ]; then
            echo "- **Azure ACR (primary for AKS):** pushed \`${SERVICE_NAME}:${ENV_PREFIX}-${SHORT_SHA}\` and \`${SERVICE_NAME}:${ENV_PREFIX}-latest\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Azure ACR:** skipped (configure \`AZURE_CLIENT_ID\`, \`AZURE_TENANT_ID\`, \`AZURE_SUBSCRIPTION_ID\`, \`ACR_LOGIN_SERVER\` in env \`${TARGET_ENV}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$HAS_DOCKERHUB" = "true" ]; then
            echo "- **Docker Hub (tracking mirror):** pushed \`mini-k8s-${SERVICE_NAME}:${ENV_PREFIX}-${SHORT_SHA}\` and \`mini-k8s-${SERVICE_NAME}:${ENV_PREFIX}-latest\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Docker Hub:** skipped (\`DOCKERHUB_USERNAME\` / \`DOCKERHUB_TOKEN\` not set in env \`${TARGET_ENV}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
