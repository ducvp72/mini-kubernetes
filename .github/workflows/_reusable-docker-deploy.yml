name: Reusable — Docker Build & Push (Docker Hub)

on:
  workflow_call:
    inputs:
      service_name:
        description: Logical service name (e.g., open-api, order-service, webhook-service)
        required: true
        type: string
      dockerfile:
        description: Relative path to the service Dockerfile
        required: true
        type: string
      context:
        description: Docker build context directory
        required: false
        default: "."
        type: string
      target_environment:
        description: Target GitHub Environment (staging for develop, production for main)
        required: true
        type: string
      push_image:
        description: Whether to push the built image (false on PRs, true on develop/main)
        required: false
        default: false
        type: boolean
      platforms:
        description: Target container platform(s)
        required: false
        default: "linux/amd64"
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username (set in GitHub Environment or repo secrets)
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub Personal Access Token (set in GitHub Environment or repo secrets)
        required: false

permissions:
  contents: read

jobs:
  docker-build-check:
    name: Docker Build Check (${{ inputs.service_name }})
    if: ${{ !inputs.push_image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile exists on branch
        id: check
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "### Skipped ${SERVICE_NAME} Docker Build Check" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${DOCKERFILE}\` is not present on this branch yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build container image (PR verification, no push)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

  docker-build-push:
    name: Docker Build & Push (${{ inputs.service_name }} -> ${{ inputs.target_environment }})
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image metadata, Dockerfile presence, and credentials
        id: meta
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET_ENV: ${{ inputs.target_environment }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$TARGET_ENV" = "production" ]; then
            ENV_PREFIX="prod"
          else
            ENV_PREFIX="staging"
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "env_prefix=${ENV_PREFIX}" >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "image_repo=${DOCKERHUB_USERNAME}/mini-k8s-${SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.meta.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_creds == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.env_prefix }}-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.env_prefix }}-latest
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Build image without push (Docker Hub secrets not configured yet)
        if: steps.meta.outputs.exists == 'true' && steps.meta.outputs.has_creds != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Write job summary
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGET_ENV: ${{ inputs.target_environment }}
          EXISTS: ${{ steps.meta.outputs.exists }}
          HAS_CREDS: ${{ steps.meta.outputs.has_creds }}
          IMAGE_REPO: ${{ steps.meta.outputs.image_repo }}
          ENV_PREFIX: ${{ steps.meta.outputs.env_prefix }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          if [ "$EXISTS" != "true" ]; then
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Skipped ${SERVICE_NAME} Docker Build & Push (${TARGET_ENV})
          \`${DOCKERFILE}\` is not present on this branch yet.
          EOF
          elif [ "$HAS_CREDS" = "true" ]; then
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Pushed ${SERVICE_NAME} (${TARGET_ENV})
          - \`${IMAGE_REPO}:${ENV_PREFIX}-${SHORT_SHA}\`
          - \`${IMAGE_REPO}:${ENV_PREFIX}-latest\`
          EOF
          else
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Docker Build Verified — Push Skipped (${SERVICE_NAME} / ${TARGET_ENV})
          \`DOCKERHUB_USERNAME\` and/or \`DOCKERHUB_TOKEN\` are not configured yet for environment \`${TARGET_ENV}\`.
          Add them in **GitHub Settings -> Environments -> ${TARGET_ENV}** (or Repository Secrets) to enable Docker Hub push.
          EOF
          fi
