name: Reusable — Go Service CI

on:
  workflow_call:
    inputs:
      service_name:
        description: Logical service name (e.g., webhook-service)
        required: true
        type: string
      working_directory:
        description: Relative directory containing go.mod
        required: true
        type: string
      go_version:
        description: Go toolchain version
        required: false
        default: "1.26"
        type: string

permissions:
  contents: read

jobs:
  go-ci:
    name: Vet, Build & Test (${{ inputs.service_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check service exists on branch
        id: check
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          WORKING_DIR: ${{ inputs.working_directory }}
        run: |
          if [ -f "${WORKING_DIR}/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "### Skipped ${SERVICE_NAME} CI" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${WORKING_DIR}/go.mod\` is not present on this branch yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Go
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
          cache-dependency-path: ${{ inputs.working_directory }}/go.sum

      - name: Go vet
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: go vet ./...

      - name: Go build
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: go build ./...

      - name: Go test (race + coverage)
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          go test -count=1 -short -race -coverprofile=coverage.out ./...
          SUMMARY="$(go tool cover -func=coverage.out | tail -n 1)"
          echo "### Go Coverage — ${SERVICE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${SUMMARY}\`" >> "$GITHUB_STEP_SUMMARY"
