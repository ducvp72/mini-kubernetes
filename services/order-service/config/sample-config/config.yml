# ==============================================================================
# Order Service — Sample Configuration Template
# ==============================================================================
# Copy or mount this file for custom environments.
#
# Config path resolution order at startup:
#   1. CONFIG_PATH environment variable (e.g., Kubernetes ConfigMap mount)
#   2. APP_ENV (fallback: ASPNETCORE_ENVIRONMENT, default: local)
#      -> <baseDir>/config/<env>/config.yml
#
# Any setting below can be overridden via environment variables using double
# underscores (__) — especially secrets such as ConnectionStrings__OrderDb.
#
# NEVER commit real passwords, tokens, or production credentials into YAML.
# ==============================================================================

connectionStrings:
  # Override via ConnectionStrings__OrderDb in Docker Compose or K8s Secrets.
  orderDb: "Server=127.0.0.1;Port=3306;Database=mini_k8s_sample;User=REPLACE_WITH_DB_USER;Password=REPLACE_WITH_DB_PASSWORD;Pooling=true;MinimumPoolSize=5;MaximumPoolSize=100;ConnectionTimeout=10;"

database:
  applyMigrationsOnStartup: false
  commandTimeoutSeconds: 5
  migrationMaxRetries: 15
  migrationRetryDelayMs: 2000
  dbContextPoolSize: 128

kafka:
  bootstrapServers: "127.0.0.1:19092"
  topic: "order.created"
  consumerGroupId: "order-service-workers"
  lingerMs: 5
  batchSizeBytes: 65536
  enableBackgroundWorkers: true

outbox:
  batchSize: 100
  pollIntervalMs: 200
  maxRetries: 5

webhookClient:
  address: "http://127.0.0.1:5002"
  timeoutSeconds: 10

grpc:
  port: 5001
  enableReflection: true

health:
  port: 8081
